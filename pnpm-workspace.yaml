packages:
  - "."
onlyBuiltDependencies:
  - esbuild
# Supply-chain policy: refuse any release younger than 24 h (what CI's pnpm 12
# applies by default), except our own packages. Stated here so a local install
# resolves the same lockfile CI accepts.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@substrat-run/*"
allowBuilds:
  # better-sqlite3 >= 13 ships prebuilt binaries but still a binding.gyp, so allowing its
  # build makes pnpm run `node-gyp rebuild` — which fails where no toolchain exists (the
  # platform's build step). Nothing here needs it.
  better-sqlite3: false
  esbuild: true
  # wrangler's runtime ships its binary as a platform package; its install script is
  # only a fallback that nothing here needs (the scaffold denies it the same way).
  workerd: false
