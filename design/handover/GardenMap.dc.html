<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:420},&quot;showPlants&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showLabels&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showScale&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showConstruction&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showMirror&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;interactive&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      showPlants: p.showPlants ?? true,
      showLabels: p.showLabels ?? true,
      showScale: p.showScale ?? false,
      showConstruction: p.showConstruction ?? false,
      showMirror: p.showMirror ?? false,
      showConstraints: p.showConstraints ?? false,
      wrap: (el) => { this.wrapEl = el; },
      view: (el) => { this.viewEl = el; }
    };
  }
  componentDidMount() {
    const wrap = this.wrapEl, view = this.viewEl;
    if (!wrap || !view || this.props.interactive === false) return;
    let k = 1, tx = 0, ty = 0, drag = null;
    const apply = () => view.setAttribute('transform', `translate(${tx} ${ty}) scale(${k})`);
    wrap.addEventListener('pointerdown', (e) => {
      drag = { x: e.clientX, y: e.clientY, tx, ty };
      wrap.setPointerCapture(e.pointerId); wrap.style.cursor = 'grabbing';
    });
    wrap.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const s = 320 / wrap.getBoundingClientRect().width;
      tx = drag.tx + (e.clientX - drag.x) * s; ty = drag.ty + (e.clientY - drag.y) * s; apply();
    });
    const end = () => { drag = null; wrap.style.cursor = 'grab'; };
    wrap.addEventListener('pointerup', end); wrap.addEventListener('pointercancel', end);
    wrap.addEventListener('wheel', (e) => {
      e.preventDefault();
      const f = Math.exp(-e.deltaY * 0.0015), nk = Math.min(4, Math.max(0.5, k * f));
      const r = wrap.getBoundingClientRect(), s = 320 / r.width;
      const mx = (e.clientX - r.left) * s, my = (e.clientY - r.top) * s;
      tx = mx - (mx - tx) * (nk / k); ty = my - (my - ty) * (nk / k); k = nk; apply();
    }, { passive: false });
  }
}
</script>
